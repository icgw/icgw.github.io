<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 88 88">
  <!-- 圆角方形背景 -->
  <rect x="0" y="0" width="88" height="88" rx="18" ry="18" fill="url(#bgGrad)"/>

  <!-- 微风线条（背景层） -->
  <path d="M10 32 C20 29, 26 35, 36 32" stroke="#FFFFFF" stroke-width="2.2" fill="none" opacity="0.30" stroke-linecap="round"/>

  <!-- 橙子主体 -->
  <circle cx="46" cy="52" r="23" fill="url(#orangeGrad)"/>

  <!-- 橙皮纹理点（精简） -->
  <circle cx="38" cy="46" r="1.8" fill="#FFCC80" opacity="0.7"/>
  <circle cx="54" cy="48" r="1.8" fill="#FFCC80" opacity="0.7"/>
  <circle cx="44" cy="60" r="1.7" fill="#FFCC80" opacity="0.7"/>

  <!-- 高光 -->
  <ellipse cx="38" cy="44" rx="7" ry="5" fill="#FFFFFF" opacity="0.32" transform="rotate(-30 38 44)"/>

  <!-- 叶子（被风吹向右侧） -->
  <path d="M46 28 C53 18, 64 17, 67 24 C60 27, 51 29, 46 28 Z" fill="#4CAF50"/>
  <path d="M46 28 C53 23, 60 21, 65 24" stroke="#388E3C" stroke-width="1.4" fill="none"/>

  <!-- 果柄 -->
  <rect x="45" y="26" width="3" height="6" rx="1.5" fill="#8D6E63"/>

  <!-- 飘落的叶子（精简为一片） -->
  <path d="M70 38 C74 35, 78 36, 79 39 C76 41, 72 41, 70 38 Z" fill="#66BB6A" opacity="0.9"/>

  <!-- 风的轨迹（前景层） -->
  <path d="M16 64 C26 69, 34 61, 44 64" stroke="#FFFFFF" stroke-width="2.4" fill="none" opacity="0.50" stroke-linecap="round"/>
  <path d="M24 72 C34 75, 44 68, 54 72 C62 75, 68 71, 73 72"
        stroke="#FFFFFF" stroke-width="2.2" fill="none" opacity="0.40" stroke-linecap="round"/>

  <!-- 风的小卷曲 -->
  <path d="M72 68 C76 66, 79 68, 78 71 C77 73, 74 73, 73 71" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <radialGradient id="orangeGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="55%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
  </defs>
</svg>
