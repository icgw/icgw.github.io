<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="橙果微风头像">
  <!-- 圆角方形背景 -->
  <rect x="0" y="0" width="88" height="88" rx="18" ry="18" fill="url(#bgGrad)"/>

  <!-- 微风线条（背景层，浅色） -->
  <path d="M8 30 C20 26, 28 34, 40 30" stroke="#FFFFFF" stroke-width="1.6" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M6 40 C16 36, 22 42, 32 39" stroke="#FFFFFF" stroke-width="1.4" fill="none" opacity="0.25" stroke-linecap="round"/>

  <!-- 橙子主体 -->
  <circle cx="46" cy="52" r="23" fill="url(#orangeGrad)"/>

  <!-- 橙皮纹理点 -->
  <circle cx="38" cy="46" r="1.4" fill="#FFCC80" opacity="0.7"/>
  <circle cx="50" cy="41" r="1.2" fill="#FFCC80" opacity="0.7"/>
  <circle cx="56" cy="51" r="1.3" fill="#FFCC80" opacity="0.7"/>
  <circle cx="42" cy="60" r="1.2" fill="#FFCC80" opacity="0.7"/>
  <circle cx="54" cy="61" r="1.4" fill="#FFCC80" opacity="0.7"/>
  <circle cx="35" cy="54" r="1.1" fill="#FFCC80" opacity="0.7"/>
  <circle cx="48" cy="53" r="1.1" fill="#FFCC80" opacity="0.7"/>

  <!-- 高光 -->
  <ellipse cx="38" cy="44" rx="7" ry="5" fill="#FFFFFF" opacity="0.3" transform="rotate(-30 38 44)"/>

  <!-- 叶子（被风吹向右侧） -->
  <path d="M46 28 C53 18, 64 17, 67 24 C60 27, 51 29, 46 28 Z" fill="#4CAF50"/>
  <path d="M46 28 C53 23, 60 21, 65 24" stroke="#388E3C" stroke-width="1" fill="none"/>

  <!-- 果柄 -->
  <rect x="45" y="26" width="2.5" height="6" rx="1.2" fill="#8D6E63"/>

  <!-- 飘落的叶子（风带动） -->
  <path d="M70 38 C74 35, 78 36, 79 39 C76 41, 72 41, 70 38 Z" fill="#66BB6A" opacity="0.9"/>
  <path d="M68 50 C71 48, 74 49, 75 51 C72 53, 69 53, 68 50 Z" fill="#81C784" opacity="0.8"/>

  <!-- 风的轨迹（前景层，环绕橙子） -->
  <path d="M14 60 C26 66, 34 58, 44 62" stroke="#FFFFFF" stroke-width="1.8" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M20 70 C30 74, 40 68, 50 72 C58 75, 66 70, 72 72"
        stroke="#FFFFFF" stroke-width="1.6" fill="none" opacity="0.45" stroke-linecap="round"/>

  <!-- 风的小卷曲 -->
  <path d="M72 68 C76 66, 79 68, 78 71 C77 73, 74 73, 73 71" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>

  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <!-- 橙子渐变 -->
    <radialGradient id="orangeGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="55%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
  </defs>
</svg>
